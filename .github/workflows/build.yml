name: 🛠️ Build Custom Lightweight Web Export Template & Package Chunks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web-template:
    runs-on: ubuntu-24.04

    steps:
      - name: 🧾 Checkout Project
        uses: actions/checkout@v4

      - name: 💽 Install Build Dependencies & Godot CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev yasm wget unzip
          
          # Скачиваем консольную версию Godot 4.7-stable для нарезки ресурсов. 
          # Адрес обернут в кавычки для защиты от сбоев ИИ-чата.
          URL="https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          wget "$URL" -O Godot_v4.7-stable_linux.x86_64.zip
          
          # Безопасно распаковываем и переименовываем в godot-cli
          unzip -p Godot_v4.7-stable_linux.x86_64.zip > godot-cli
          chmod +x godot-cli

      - name: 🌐 Setup Emscripten (Compiler for Web)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20

      - name: 📥 Clone Godot Engine source code (v4.7)
        run: |
          git clone --depth 1 --branch 4.7-stable https://github.com/godotengine/godot.git godot-source

      - name: ⚙️ Compile Custom Lightweight Web Template
        run: |
          cd godot-source
          scons platform=web target=template_release optimize=size production=yes lto=full \
            minizip=no brotli=no woff2=no graphviz=no \
            module_basis_universal_enabled=no module_bmp_enabled=no \
            module_dds_enabled=no module_pvr_enabled=no module_tga_enabled=no \
            module_gridmap_enabled=no module_jsonrpc_enabled=no \
            module_regex_enabled=no module_theora_enabled=no \
            module_upnp_enabled=no module_webm_enabled=no \
            module_lightmapper_rd_enabled=no \
            build_profile="../minimize.gdbuild"

      - name: 🚀 Automate Split Web Export (Chunks 512 KiB)
        run: |
          mkdir -p FinalBuild/
          
          # Создаем стандартную папку шаблонов Godot на сервере GitHub
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATES_DIR"
          SRC_ZIP="godot-source/bin/godot.web.template_release.wasm32.zip"
          cp "$SRC_ZIP" "$TEMPLATES_DIR/web_release.zip"
          cp "$SRC_ZIP" "$TEMPLATES_DIR/web_nothreads_release.zip"
          cp "$SRC_ZIP" "$TEMPLATES_DIR/web_nothreads_debug.zip"
          
          # Стираем локальные пути вашего компьютера из конфига проекта
          sed -i 's|custom_template/release=".*"|custom_template/release=""|g' export_presets.cfg
          sed -i 's|custom_template/debug=".*"|custom_template/debug=""|g' export_presets.cfg
          
          # ИСПРАВЛЕНИЕ: Возвращаем правильный фильтр экспорта только РЕАЛЬНЫХ ресурсов игры,
          # чтобы pck весил свои законные 7.8 МБ, а не 137 МБ!
          sed -i 's/export_filter="all_resources"/export_filter="resources"/g' export_presets.cfg
          
          # Отключаем встроенный сплит Godot, так как мы сделаем его надежнее силами Linux
          sed -i 's/split_pck=true/split_pck=false/g' export_presets.cfg
          
          # Запускаем экспорт проекта через консоль Godot (получаем чистый весящий 7.8 МБ pck)
          ./godot-cli --headless --export-release "Web" FinalBuild/index.html
          
          # --- НАДЁЖНАЯ НАРЕЗКА МОНОЛИТА НА ЧАНКИ ПО 512 КБ ЧЕРЕЗ LINUX SPLIT ---
          cd FinalBuild/
          # Разрезаем index.pck на файлы index.pck.001, index.pck.002 и т.д.
          split -b 512k -d --suffix-length=3 index.pck index.pck.
          # Удаляем исходный тяжелый монолит, чтобы он не занимал место в ZIP
          rm index.pck
          cd ..
          
          # Подставляем наш проверенный универсальный index.html и исправленный мост SDK
          cp index.html FinalBuild/index.html || true
          cp YTGameSDK_v2.js FinalBuild/YTGameSDK_v2.js || true

      - name: 📦 Pack Final Chanked ZIP for Mediacube
        run: |
          cd FinalBuild/
          # Упаковываем файлы напрямую из папки (все чанки index.pck.000, index.pck.001 попадут внутрь)
          zip -r ../KawaiiToyWash_YT_Ready.zip ./*

      - name: 💾 Upload Ready-to-Publish Playable Archive
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Playables-Final-Package
          path: KawaiiToyWash_YT_Ready.zip
