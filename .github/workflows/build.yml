name: 🛠️ Build Custom Lightweight Web Export Template & Package Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web-template-and-export:
    runs-on: ubuntu-24.04

    steps:
      - name: 🧾 Checkout Project
        uses: actions/checkout@v4

      - name: 💽 Install Build Dependencies & Godot CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev yasm wget unzip
          
          # Скачиваем официальную консольную версию Godot 4.7-stable для автоматического экспорта ресурсов
          wget https://github.com
          unzip Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-cli
          chmod +x godot-cli

      - name: 🌐 Setup Emscripten (Compiler for Web)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20

      - name: 📥 Clone Godot Engine source code (v4.7)
        run: |
          git clone --depth 1 --branch 4.7-stable https://github.com/godotengine/godot.git godot-source

      - name: ⚙️ Compile Custom Lightweight Web Template
        run: |
          cd godot-source
          scons platform=web target=template_release optimize=size production=yes lto=full \
            minizip=no brotli=no woff2=no graphviz=no \
            module_basis_universal_enabled=no module_bmp_enabled=no \
            module_dds_enabled=no module_pvr_enabled=no module_tga_enabled=no \
            module_gridmap_enabled=no module_jsonrpc_enabled=no \
            module_regex_enabled=no module_theora_enabled=no \
            module_upnp_enabled=no module_webm_enabled=no \
            module_lightmapper_rd_enabled=no \
            build_profile="../minimize.gdbuild"

      # ============================================================================
      # ПРОФЕССИОНАЛЬНАЯ ПОСТОБРАБОТКА ДЛЯ YOUTUBE PLAYABLES / MEDIACUBE
      # ============================================================================
      - name: 🚀 Automate Clean Web Export (Zero-Timeout Architecture)
        run: |
          mkdir -p FinalBuild/
          
          # Регистрируем наш собранный кастомный легковесный WASM-шаблон в системе Godot
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable/
          cp godot-source/bin/godot.web.template_release.wasm32.zip ~/.local/share/godot/export_templates/4.7.stable/web_release.zip
          
          # Подготавливаем export_presets.cfg: заставляем Godot выносить ассеты из .pck наружу
          # Режим script_export_mode=2 и убирание фильтров заставит движок собрать только логику в pck
          sed -i 's/export_filter="all_resources"/export_filter="resources"/g' export_presets.cfg
          
          # Запускаем экспорт проекта через консоль Godot
          ./godot-cli --headless --export-release "Web" FinalBuild/index.html
          
          # Копируем наши внешние текстуры персонажей (.webp) напрямую в корень архива сборки, 
          # чтобы они загружались поштучно по сети в обход тяжелого монолитного .pck
          if [ -d "assets" ]; then
            cp -r assets FinalBuild/
          fi
          
          # Внедряем наш универсальный index.html и отказоустойчивый YTGameSDK_v2.js в папку
          # (Если они лежат у вас в репозитории — они просто заменят дефолтные файлы движка)
          cp index.html FinalBuild/index.html || true
          cp YTGameSDK_v2.js FinalBuild/YTGameSDK_v2.js || true

      - name: 📦 Pack Final Low-Weight Playables ZIP
        run: |
          cd FinalBuild/
          # Пакуем ВСЕ файлы напрямую из корня папки в финальный архив для Mediacube
          zip -r ../KawaiiToyWash_YT_Ready.zip ./*

      - name: 💾 Upload Ready-to-Publish Playable Archive
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Playables-Final-Package
          path: KawaiiToyWash_YT_Ready.zip
