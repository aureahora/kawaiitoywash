name: 🛠️ Build Custom Lightweight Web Export Template

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web-template:
    runs-on: ubuntu-24.04

    steps:
      - name: 🧾 Checkout Project
        uses: actions/checkout@v4

      - name: 💽 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev yasm

      - name: 🌐 Setup Emscripten (Compiler for Web)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20

      - name: 📥 Clone Godot Engine source code (v4.7)
        run: |
          git clone --depth 1 --branch 4.7-stable https://github.com/godotengine/godot.git godot-source

      - name: ⚙️ Compile Custom Lightweight Web Template
        run: |
          cd godot-source
          # Компилируем с экстремальным вырезанием неиспользуемых подсистем движка
          scons platform=web target=template_release optimize=size production=yes \
            minizip=no brotli=no woff2=no graphviz=no \
            module_basis_universal_enabled=no module_bmp_enabled=no \
            module_dds_enabled=no module_pvr_enabled=no module_tga_enabled=no \
            module_gridmap_enabled=no module_jsonrpc_enabled=no \
            module_regex_enabled=no module_theora_enabled=no \
            module_upnp_enabled=no module_webm_enabled=no \
            build_config="../minimize.gdbuild"

      - name: 📦 Upload Lightweight Web WASM Template
        uses: actions/upload-artifact@v4
        with:
          name: custom-godot-web-templates
          path: godot-source/bin/godot.web.template_release.wasm32.zip
